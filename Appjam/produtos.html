<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos — Precifica.IA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { deep: '#0f291e' }, success: '#2e8b57', accent: '#f9a825' } } } }
  </script>
</head>
<body class="antialiased flex min-h-screen">

  <aside class="hidden md:flex w-64 flex-col justify-between border-r border-theme bg-brand-deep text-brand-fg">
    <div>
      <div class="flex h-20 items-center border-b border-white/10 px-4">
        <img src="logo.png"
          <h2 class="hidden sm:block text-base font-bold whitespace-nowrap">Gestão de Produtos</h2>
        <div class="relative min-w-0 w-full max-w-xs">
          <svg class="absolute left-3 top-2.5 size-4 text-muted" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Buscar produto ou SKU..." class="w-full rounded-xl bg-input-theme py-1.5 pl-9 pr-4 text-xs outline-none focus:ring-2 focus:ring-[var(--primary)]" />
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-3">
        <button id="theme-toggle" type="button" title="Alternar Tema" class="rounded-xl bg-secondary p-2 text-muted transition hover:text-foreground">
          <svg id="icon-moon" class="size-4" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg id="icon-sun" class="size-4 hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <main class="flex-1 space-y-6 overflow-y-auto p-4 md:p-6">
      <!-- Tabela CRUD -->
      <section class="space-y-4 rounded-2xl border border-theme bg-card p-6">
        <div class="flex justify-between items-center gap-4">
          <div>
            <h3 class="text-lg font-bold">Catálogo Mestre</h3>
            <p class="text-xs text-muted">Controle o cadastro mestre. A IA define a sugestão de markup automaticamente.</p>
          </div>
          <button onclick="openModal()" class="rounded-xl bg-[var(--primary)] px-4 py-2 text-xs font-bold text-white hover:opacity-90">
            + Adicionar Produto
          </button>
        </div>
        
        <div class="overflow-x-auto mt-4">
          <table class="w-full text-left text-xs min-w-[700px]">
            <thead class="border-b border-theme uppercase tracking-wider text-muted bg-secondary">
              <tr>
                <th class="p-3 font-semibold">Produto / EAN</th>
                <th class="p-3 font-semibold">Categoria / Meta</th>
                <th class="p-3 font-semibold">Custo Atual</th>
                <th class="p-3 font-semibold">Preço Final (PDV)</th>
                <th class="p-3 font-semibold">Validade</th>
                <th class="p-3 text-right font-semibold">Ações</th>
              </tr>
            </thead>
            <tbody id="products-table-body" class="divide-y divide-theme">
              <!-- Injetado via app.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Modal Form -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay">
      <div class="bg-card w-full max-w-md rounded-2xl shadow-2xl p-6 border border-theme">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-lg" id="modal-title">Adicionar Produto</h3>
          <button onclick="closeModal()" class="text-muted font-bold hover:text-destructive-theme">X</button>
        </div>
        
        <form id="product-form" class="space-y-4">
          <input type="hidden" id="form-id" />
          
          <div>
            <label class="block text-xs font-semibold mb-1">Nome do Produto</label>
            <input type="text" id="form-name" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold mb-1">EAN</label>
              <input type="text" id="form-ean" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Categoria</label>
              <select id="form-cat" class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme">
                <option value="Mercearia">Mercearia</option>
                <option value="Açougue">Açougue</option>
                <option value="Laticínios">Laticínios</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold mb-1">Custo Unit. (R$)</label>
              <input type="number" step="0.01" id="form-cost" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Preço Atual (R$)</label>
              <input type="number" step="0.01" id="form-price" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold mb-1">Dias p/ Vencer</label>
              <input type="number" id="form-expiry" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Giro Mensal</label>
              <input type="number" id="form-giro" required class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme" />
            </div>
          </div>

          <button type="submit" class="w-full rounded-xl bg-[var(--primary)] py-2.5 text-xs font-bold text-white shadow hover:opacity-90 mt-2">
            Salvar Produto
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
