<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — Precifica.IA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { deep: '#0f291e' }, success: '#2e8b57', accent: '#f9a825' } } } }
  </script>
</head>
<body class="antialiased flex min-h-screen">

  <aside class="hidden md:flex w-64 flex-col justify-between border-r border-theme bg-brand-deep text-brand-fg">
    <div>
      <div class="flex h-20 items-center border-b border-white/10 px-4 gap-2">
        <div class="bg-accent-theme p-1.5 rounded-lg text-accent-fg font-bold">IA</div>
        <div><h1 class="text-sm font-bold text-white tracking-wide">Precifica.<span class="text-accent-theme">IA</span></h1></div>
      </div>
      <nav class="p-4 space-y-1.5">
        <a href="index.html" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white">Dashboard</a>
        <a href="produtos.html" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white">Produtos & Preços</a>
        <a href="analytics.html" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white">Analytics de Margem</a>
        <a href="alertas.html" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white">Alertas IPCA</a>
        <a href="config.html" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium sidebar-active">Configurações</a>
      </nav>
    </div>
  </aside>

  <div class="flex flex-1 flex-col h-screen overflow-hidden relative">
    <header class="z-10 flex min-h-16 items-center justify-between border-b border-theme bg-card px-4 py-2 md:px-6">
      <h2 class="text-base font-bold">Configurações do Sistema</h2>
      <button id="theme-toggle" class="ml-auto rounded-xl bg-secondary p-2 text-muted text-xs font-bold hover:text-foreground">Alternar Tema</button>
    </header>

    <main class="flex-1 space-y-6 overflow-y-auto p-4 md:p-6">
      <section class="space-y-4 rounded-2xl border border-theme bg-card p-6">
        <div>
          <h3 class="text-lg font-bold">Ajustes e Integrações</h3>
          <p class="text-xs text-muted">Gerencie preferências de integração com seu ERP de retaguarda e informações da loja.</p>
        </div>
        
        <form id="form-config" class="max-w-lg space-y-4 pt-4">
          <div>
            <label class="mb-1 block text-xs font-bold">Nome da Empresa / Supermercado</label>
            <input value="Supermercado Gaúcho Ltda - Viamão" class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme focus:ring-2 focus:ring-[var(--primary)]" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-bold">Chave de Integração API (Sistema de PDV)</label>
            <input type="password" value="expoagas-2026-api-key" class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme focus:ring-2 focus:ring-[var(--primary)]" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-bold">Comportamento do Arredondamento (Preço de Venda)</label>
            <select class="w-full rounded-xl bg-input-theme px-3 py-2 text-xs outline-none border border-theme focus:ring-2 focus:ring-[var(--primary)]">
              <option>Finalizar em .90 ou .99 (Psicológico)</option>
              <option>Finalizar em .50 ou .00</option>
              <option>Valor Exato (Quebrado)</option>
            </select>
          </div>
          <button type="submit" class="rounded-xl bg-[var(--primary)] px-5 py-2.5 text-xs font-bold text-white transition hover:opacity-90 mt-4">
            Salvar Alterações
          </button>
        </form>
      </section>
    </main>

    <!-- Notificação de Toast (Canto da Tela) -->
    <div id="notice" class="fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg bg-[var(--fg)] px-6 py-3 text-center text-xs font-semibold text-[var(--bg)] shadow-lg transition-opacity opacity-0"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
